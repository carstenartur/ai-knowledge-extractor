name: Apply JavaScript boundary implementation

on:
  push:
    branches:
      - feature/javascript-typescript-boundary-analysis

permissions:
  contents: write

concurrency:
  group: apply-javascript-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/javascript-typescript-boundary-analysis
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'
      - name: Materialize implementation
        run: |
          cat .github/implementation/js-boundary.part-* > /tmp/implementation.b64
          base64 --decode /tmp/implementation.b64 > /tmp/implementation.tar.xz
          echo "060684021c4d9dd1bbd762a9655bd9eb5513c7418da7e58631a2c76b3e026b5e  /tmp/implementation.tar.xz" | sha256sum --check -
          tar -xJf /tmp/implementation.tar.xz
          rm -rf .github/implementation
          rm -f .github/workflows/apply-js-boundary-implementation.yml
      - name: Check content
        run: |
          git diff --check
          ! grep -RInE 'org\.eclipse\.jgit|git log|co-change score|commit-based change coupling' core/src/main/java
      - name: Verify
        run: gradle clean build --warning-mode all
      - name: Commit implementation
        run: |
          git config user.name "ai-knowledge-extractor automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add JavaScript and frontend backend boundary analysis"
          git push origin HEAD:feature/javascript-typescript-boundary-analysis
