name: CI

on:
  push:
    branches:
      - main
      - 'maintenance/**'
  pull_request:
    branches:
      - main
      - 'maintenance/**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: Supported target branch for an explicitly dispatched release-follow-up CI run
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify supported release-line policy
        env:
          DISPATCH_TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_release_line_policy.py
          target_branch="$DISPATCH_TARGET_BRANCH"
          if [[ -z "$target_branch" ]]; then
            target_branch="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          fi
          version=$(grep -E '^projectVersion=' gradle.properties | head -n 1 | cut -d= -f2 | tr -d '[:space:]')
          python3 .github/scripts/release_line_policy.py \
            verify-branch-version \
            --branch "$target_branch" \
            --project-version "$version"
          echo "AI_KNOWLEDGE_TARGET_BRANCH=$target_branch" >> "$GITHUB_ENV"

      - name: Verify version consistency
        run: python3 .github/scripts/verify-version-consistency.py

      - name: Verify release-readiness metadata
        run: bash .github/scripts/verify-release-readiness.sh --metadata-only

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: |
          set -o pipefail
          gradle build --warning-mode all 2>&1 | tee gradle-build.log

      - name: Upload failed Gradle build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-diagnostics
          path: |
            gradle-build.log
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn

      - name: Verify Javadocs under the POSIX locale
        env:
          LC_ALL: C
          LANG: C
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
        run: |
          gradle --no-daemon --warning-mode all \
            :core:javadoc \
            :gradle-plugin:javadoc \
            :maven:javadoc

      - name: Verify Gradle and Maven consumer fixtures
        run: bash .github/scripts/verify-consumer-fixtures.sh

      - name: Upload consumer fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-fixture-diagnostics
          path: build/reports/consumer-fixtures/*.log
          if-no-files-found: ignore

      - name: Verify Maven site generation
        run: |
          set -o pipefail
          VERSION=$(grep -E '^projectVersion=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]')
          mkdir -p build/reports/release-readiness
          SITE_LOG=build/reports/release-readiness/maven-site.log
          mvn -B -f site/pom.xml -Drevision="$VERSION" process-resources site 2>&1 | tee "$SITE_LOG"
          if grep -F '[WARNING]' "$SITE_LOG"; then
            echo 'Maven site generation emitted warnings' >&2
            exit 1
          fi
          if grep -E 'NoSuchMethodError|LinkageError|An issue has occurred|old pre-version' "$SITE_LOG"; then
            echo 'Maven site generation skipped or failed a report' >&2
            exit 1
          fi
          for page in \
            index \
            generate-mojo \
            analyze-mojo \
            optimize-mojo \
            benchmark-mojo \
            check-mojo \
            help-mojo; do
            test -s "site/target/site/${page}.html"
          done
          test ! -e site/target/site/plugin-info.html
          if grep -R "/home/runner/" site/target/site/; then
            echo 'Found forbidden absolute paths in generated site' >&2
            exit 1
          fi

      - name: Upload Maven site diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-site-diagnostics
          path: build/reports/release-readiness/maven-site.log
          if-no-files-found: ignore
