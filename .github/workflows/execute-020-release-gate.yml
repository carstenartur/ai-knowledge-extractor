name: Execute fail-closed 0.2.0 release gate

on:
  push:
    branches:
      - release/0.2.0-execute
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: execute-020-release-gate
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gate definition
        uses: actions/checkout@v7
        with:
          ref: release/0.2.0-execute
          fetch-depth: 0

      - name: Wait for a clean 0.2.0 candidate on main
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            git fetch origin main
            git checkout -B release-main origin/main

            VERSION=$(sed -n 's/^projectVersion=//p' gradle.properties | head -n1 | tr -d '[:space:]')
            RELEASE=$(sed -n 's/^next.release.version=//p' release.properties | head -n1 | tr -d '[:space:]')

            required=(
              core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
              docs/integrator-quickstart.md
              docs/provider-spi.md
              docs/schema-v2-contract.md
              docs/releases/0.2.0.md
              docs/release-checklist.md
              CHANGELOG.md
              .github/scripts/verify-release-readiness.sh
            )
            missing=false
            for path in "${required[@]}"; do
              [[ -s "$path" ]] || missing=true
            done

            temporary=false
            for path in \
              .github/scripts/materialize-020-hardening-base.py \
              .github/scripts/apply-release-hardening.py \
              .github/workflows/materialize-020-hardening-base.yml \
              .github/workflows/finalize-020-preparation-v2-v3.yml \
              .github/workflows/finalize-020-preparation-v3.yml \
              .github/workflows/build-merge-020-final.yml \
              .github/workflows/verify-020-hardening-main.yml \
              .github/workflows/post-verify-020-cleanup.yml \
              .github/workflows/post-verify-020-final-cleanup.yml; do
              [[ ! -e "$path" ]] || temporary=true
            done

            if [[ "$VERSION" == 0.2.0-SNAPSHOT \
                  && "$RELEASE" == 0.2.0 \
                  && "$missing" == false \
                  && "$temporary" == false ]]; then
              ready=true
              break
            fi

            echo "main is not ready yet (attempt $attempt/60, version=$VERSION, release=$RELEASE, missing=$missing, temporary=$temporary)"
            sleep 30
          done

          if [[ "$ready" != true ]]; then
            echo "main did not become a clean 0.2.0 release candidate" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Verify exact main release candidate
        run: |
          set -euo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_ENV"

          python3 .github/scripts/verify-version-consistency.py
          gradle --no-daemon clean check publishToMavenLocal --warning-mode all
          bash .github/scripts/verify-consumer-fixtures.sh
          mvn -B -f site/pom.xml -Drevision=0.2.0-SNAPSHOT process-resources site
          bash .github/scripts/verify-release-readiness.sh --metadata-only

          if grep -RInE 'org\.eclipse\.jgit|\bgit log\b|co[- ]?change|changeCouplingIncluded[^\n]*true' \
              core/src/main gradle-plugin/src/main maven/src/main; then
            echo "Git-history or commit-derived change coupling entered production scope" >&2
            exit 1
          fi

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"

      - name: Dispatch audited publish workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow publish.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')

          if ! gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main; then
            INPUT=$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/publish.yml').read_text(encoding='utf-8')
          candidates = []
          lines = text.splitlines()
          for index, line in enumerate(lines):
              match = re.match(r'^\s{4,8}([A-Za-z_][A-Za-z0-9_-]*):\s*$', line)
              if not match:
                  continue
              key = match.group(1)
              block = '\n'.join(lines[index:index + 16]).lower()
              if 'patch' in block and 'minor' in block and 'major' in block:
                  candidates.append(key)
          print(candidates[0] if candidates else '')
          PY
          )
            if [[ -z "$INPUT" ]]; then
              echo "Could not dispatch publish.yml with defaults and found no patch/minor/major input" >&2
              exit 1
            fi
            gh workflow run publish.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "$INPUT=patch"
          fi

          RUN_ID=''
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow publish.yml \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,status \
              --jq ".[] | select(.databaseId != $BEFORE and .headSha == \"$candidate_sha\") | .databaseId" \
              | head -n1)
            [[ -n "$RUN_ID" ]] && break
            sleep 5
          done
          if [[ -z "$RUN_ID" ]]; then
            echo "No publish workflow run appeared for candidate $candidate_sha" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for audited publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify release tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/tmp/release.txt 2>/dev/null; then
              cat /tmp/release.txt
              exit 0
            fi
            sleep 10
          done
          echo "The publish workflow succeeded but GitHub release v0.2.0 was not found" >&2
          exit 1
