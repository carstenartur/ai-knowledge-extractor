name: Finalize 0.2.0 preparation v5

on:
  push:
    branches:
      - release/0.2.0-preparation-v2
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-020-preparation-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@v7
        with:
          ref: release/0.2.0-preparation-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Configure repository identity and merge current main
        run: |
          set -euo pipefail
          git config user.name "ai-knowledge-extractor automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize the complete product change
        run: |
          set -euo pipefail
          git fetch origin release/0.2.0-hardening:refs/remotes/origin/release/0.2.0-hardening
          git show origin/release/0.2.0-hardening:.github/scripts/apply-release-hardening.py \
            > /tmp/apply-release-hardening.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply-release-hardening.py')
          source = path.read_text(encoding='utf-8')

          replacements = {
              'update("core/src/main/java/org/aiknowledge/core/KnowledgeExtractionPipeline.java", patch_pipeline)':
                  'print("deferred KnowledgeExtractionPipeline patch for current source model")',
              'JavaScriptKnowledgeProvider': 'JavaScriptTypeScriptKnowledgeProvider',
              '.callableFacts()': '.symbolFacts()',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'materializer compatibility marker missing: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY

          python3 /tmp/apply-release-hardening.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          result = Path('core/src/main/java/org/aiknowledge/core/sourcespi/SourceKnowledgeResult.java')
          result.write_text('''package org.aiknowledge.core.sourcespi;

import java.util.List;
import java.util.Map;

/**
 * Language-neutral JSON-compatible facts emitted by a source provider.
 *
 * <p>Callables are symbols with {@code kind=callable}; parser-specific AST objects never cross
 * this contract. Empty categories are represented by empty lists. Recoverable limitations are
 * emitted through {@code warningFacts}; fatal I/O failures follow the shared source error policy.</p>
 */
public record SourceKnowledgeResult(
        List<Map<String, Object>> sourceUnitFacts,
        List<Map<String, Object>> symbolFacts,
        List<Map<String, Object>> relationFacts,
        List<Map<String, Object>> boundaryFacts,
        List<Map<String, Object>> warningFacts) {

    public SourceKnowledgeResult {
        sourceUnitFacts = immutable(sourceUnitFacts);
        symbolFacts = immutable(symbolFacts);
        relationFacts = immutable(relationFacts);
        boundaryFacts = immutable(boundaryFacts);
        warningFacts = immutable(warningFacts);
    }

    public static SourceKnowledgeResult empty() {
        return new SourceKnowledgeResult(List.of(), List.of(), List.of(), List.of(), List.of());
    }

    private static List<Map<String, Object>> immutable(List<Map<String, Object>> values) {
        return values == null ? List.of() : List.copyOf(values);
    }
}
''', encoding='utf-8')

          pipeline_path = Path('core/src/main/java/org/aiknowledge/core/KnowledgeExtractionPipeline.java')
          pipeline = pipeline_path.read_text(encoding='utf-8')
          import_line = 'import org.aiknowledge.core.sourcespi.SourceAnalysisConfiguration;'
          if import_line not in pipeline:
              marker = 'import org.aiknowledge.core.sourcespi.SourceKnowledgeProvider;'
              if marker not in pipeline:
                  raise SystemExit('source provider import marker missing')
              pipeline = pipeline.replace(marker, import_line + '\n' + marker, 1)

          field = ('    private final SourceAnalysisConfiguration sourceAnalysisConfiguration = '
                   'SourceAnalysisConfiguration.fromSystemProperties();\n')
          if 'private final SourceAnalysisConfiguration sourceAnalysisConfiguration' not in pipeline:
              marker = '    private final List<SourceKnowledgeProvider> sourceKnowledgeProviders;\n'
              if marker not in pipeline:
                  raise SystemExit('source provider field marker missing')
              pipeline = pipeline.replace(marker, marker + field, 1)

          old_loop = '''                if (!provider.supports(path)) continue;
                SourceKnowledgeResult result = provider.extract(new SourceKnowledgeRequest(
                        root,
                        file,
                        path,
                        snapshot.modules,
                        buildMetadata,
                        Map.of()));
                recordSourceFacts(snapshot, provider, path, result);'''
          new_loop = '''                if (!sourceAnalysisConfiguration.providerEnabled(provider.id())
                        || !provider.supports(path)
                        || !sourceAnalysisConfiguration.acceptsSource(file, path)) {
                    continue;
                }
                try {
                    SourceKnowledgeResult result = provider.extract(new SourceKnowledgeRequest(
                            root,
                            file,
                            path,
                            snapshot.modules,
                            buildMetadata,
                            Map.of()));
                    recordSourceFacts(snapshot, provider, path, result);
                } catch (Exception exception) {
                    handleSourceProviderFailure(snapshot, provider, path, exception);
                }'''
          if old_loop in pipeline:
              pipeline = pipeline.replace(old_loop, new_loop, 1)
          elif new_loop not in pipeline:
              raise SystemExit('current provider loop marker missing')

          if 'private void handleSourceProviderFailure(' not in pipeline:
              marker = '    private static void recordJavaFacts(RepositorySnapshot snapshot) {'
              if marker not in pipeline:
                  raise SystemExit('recordJavaFacts marker missing')
              handler = '''    private void handleSourceProviderFailure(
            RepositorySnapshot snapshot,
            SourceKnowledgeProvider provider,
            String sourcePath,
            Exception exception) throws IOException {
        if (sourceAnalysisConfiguration.errorPolicy() == SourceAnalysisConfiguration.ErrorPolicy.FAIL) {
            if (exception instanceof IOException ioException) throw ioException;
            throw new IOException("Source provider " + provider.id() + " failed for " + sourcePath, exception);
        }
        if (sourceAnalysisConfiguration.errorPolicy() == SourceAnalysisConfiguration.ErrorPolicy.WARN) {
            Map<String, Object> warning = new LinkedHashMap<>();
            warning.put("provider", provider.id());
            warning.put("sourceFile", sourcePath);
            warning.put("code", "source-provider-failure");
            warning.put("message", exception.getClass().getSimpleName() + ": "
                    + String.valueOf(exception.getMessage()));
            snapshot.warnings.add(warning);
        }
    }

'''
              pipeline = pipeline.replace(marker, handler + marker, 1)

          evidence = '        snapshot.evidence.add(sourceAnalysisConfiguration.asEvidence());\n'
          if evidence not in pipeline:
              marker = '        RepositoryFacts.populateIndex(root, snapshot);'
              if marker not in pipeline:
                  raise SystemExit('repository index marker missing')
              pipeline = pipeline.replace(marker, evidence + marker, 1)
          pipeline_path.write_text(pipeline, encoding='utf-8')

          provider_docs = Path('docs/provider-spi.md')
          docs = provider_docs.read_text(encoding='utf-8')
          docs = docs.replace(
              '- `symbolFacts`: types, fields, values and declarations;\n'
              '- `callableFacts`: functions, methods, hooks or equivalent executable symbols;',
              '- `symbolFacts`: types, fields, values, declarations and executable symbols with `kind=callable`;')
          provider_docs.write_text(docs, encoding='utf-8')

          gradle = Path('gradle.properties')
          lines = [
              line for line in gradle.read_text(encoding='utf-8').splitlines()
              if not line.startswith('projectVersion=')
          ]
          lines.append('projectVersion=0.2.0-SNAPSHOT')
          gradle.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('release.properties').write_text(
              '# Managed by the audited release workflow.\nnext.release.version=0.2.0\n',
              encoding='utf-8')

          plugin = Path('maven/src/main/resources/META-INF/maven/plugin.xml')
          plugin_text, count = re.subn(
              r'(<version>)[^<]+(</version>)',
              r'\g<1>0.2.0-SNAPSHOT\g<2>',
              plugin.read_text(encoding='utf-8'),
              count=1)
          if count != 1:
              raise SystemExit('Maven plugin descriptor version marker missing')
          plugin.write_text(plugin_text, encoding='utf-8')
          PY

          python3 .github/scripts/update-release-metadata.py 0.2.0-SNAPSHOT

          rm -rf .release-transfer
          rm -f \
            .github/scripts/materialize-020-hardening-base.py \
            .github/scripts/apply-release-hardening.py \
            .github/workflows/materialize-020-hardening-base.yml \
            .github/workflows/export-preparation-source.yml \
            .github/workflows/finalize-020-preparation-v2-v3.yml \
            .github/workflows/export-release-hardening-bootstrap.yml \
            .github/workflows/apply-release-hardening.yml \
            .github/workflows/finalize-release-hardening.yml \
            .github/workflows/override-finalize-release-hardening.yml \
            .github/workflows/verify-020-hardening-main.yml \
            .github/workflows/post-verify-020-cleanup.yml \
            .github/workflows/post-verify-020-final-cleanup.yml

          required=(
            core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
            docs/integrator-quickstart.md
            docs/provider-spi.md
            docs/schema-v2-contract.md
            docs/releases/0.2.0.md
            docs/release-checklist.md
            CHANGELOG.md
            .github/scripts/verify-release-readiness.sh
          )
          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "Missing required hardening output: $path" >&2
              exit 1
            }
          done

          if grep -RInE 'org\.eclipse\.jgit|\bgit log\b|co[- ]?change|changeCouplingIncluded[^\n]*true' \
              core/src/main gradle-plugin/src/main maven/src/main; then
            echo "Git-history or commit-derived change coupling entered production scope" >&2
            exit 1
          fi

          chmod +x .github/scripts/verify-release-readiness.sh
          git diff --check

      - name: Verify the preparation tree
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-version-consistency.py
          gradle --no-daemon clean check publishToMavenLocal --warning-mode all
          bash .github/scripts/verify-consumer-fixtures.sh
          VERSION=$(sed -n 's/^projectVersion=//p' gradle.properties | head -n1 | tr -d '[:space:]')
          mvn -B -f site/pom.xml -Drevision="$VERSION" process-resources site
          bash .github/scripts/verify-release-readiness.sh --metadata-only

      - name: Commit verified preparation
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Harden 0.2.0 integration and provider contracts"
          git push origin HEAD:release/0.2.0-preparation-v2

      - name: Create or update pull request and squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head release/0.2.0-preparation-v2 \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head release/0.2.0-preparation-v2 \
              --title "Harden 0.2.0 integration and provider contracts" \
              --body "Adds the shared source scan policy, Gradle/Maven configuration parity, provider SPI contract, schema-v2 contract, mixed Java/TypeScript tests, release documentation and publication checks. Git history and commit-derived change coupling remain explicitly excluded.")
            PR_NUMBER=${PR_URL##*/}
          else
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harden 0.2.0 integration and provider contracts" \
              --body "Adds the shared source scan policy, Gradle/Maven configuration parity, provider SPI contract, schema-v2 contract, mixed Java/TypeScript tests, release documentation and publication checks. Git history and commit-derived change coupling remain explicitly excluded."
          fi

          HEAD_SHA=$(git rev-parse HEAD)
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "Harden 0.2.0 integration and provider contracts" \
            --body "Verified with the complete Gradle build, Maven-local publication, Gradle and Maven consumer fixtures, Maven site generation and release-contract checks."

      - name: Verify the exact merged main tree
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B verified-main origin/main
          test -f core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
          test ! -e .github/workflows/finalize-020-preparation-v2-v3.yml
          test ! -e .github/workflows/verify-020-hardening-main.yml
          test ! -e .release-transfer
          python3 .github/scripts/verify-version-consistency.py
          gradle --no-daemon clean check publishToMavenLocal --warning-mode all
          bash .github/scripts/verify-consumer-fixtures.sh
          VERSION=$(sed -n 's/^projectVersion=//p' gradle.properties | head -n1 | tr -d '[:space:]')
          mvn -B -f site/pom.xml -Drevision="$VERSION" process-resources site
          bash .github/scripts/verify-release-readiness.sh --metadata-only
