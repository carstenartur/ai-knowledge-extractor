name: Finalize 0.2.0 preparation v4

on:
  push:
    branches:
      - release/0.2.0-preparation-v2
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-020-preparation-v2-v4
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@v7
        with:
          ref: release/0.2.0-preparation-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Configure repository identity and merge current main
        run: |
          set -euo pipefail
          git config user.name "ai-knowledge-extractor automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize the complete product change
        run: |
          set -euo pipefail
          git fetch origin release/0.2.0-hardening:refs/remotes/origin/release/0.2.0-hardening
          git show origin/release/0.2.0-hardening:.github/scripts/apply-release-hardening.py \
            > /tmp/apply-release-hardening.py
          python3 /tmp/apply-release-hardening.py

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('gradle.properties')
          lines = [
              line for line in gradle.read_text(encoding='utf-8').splitlines()
              if not line.startswith('projectVersion=')
          ]
          lines.append('projectVersion=0.2.0-SNAPSHOT')
          gradle.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          Path('release.properties').write_text(
              '# Managed by the audited release workflow.\nnext.release.version=0.2.0\n',
              encoding='utf-8')
          PY

          rm -rf .release-transfer
          rm -f \
            .github/scripts/materialize-020-hardening-base.py \
            .github/scripts/apply-release-hardening.py \
            .github/workflows/materialize-020-hardening-base.yml \
            .github/workflows/export-preparation-source.yml \
            .github/workflows/finalize-020-preparation-v2-v3.yml \
            .github/workflows/export-release-hardening-bootstrap.yml \
            .github/workflows/apply-release-hardening.yml \
            .github/workflows/finalize-release-hardening.yml \
            .github/workflows/override-finalize-release-hardening.yml \
            .github/workflows/verify-020-hardening-main.yml \
            .github/workflows/post-verify-020-cleanup.yml \
            .github/workflows/post-verify-020-final-cleanup.yml

          required=(
            core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
            docs/integrator-quickstart.md
            docs/provider-spi.md
            docs/schema-v2-contract.md
            docs/releases/0.2.0.md
            docs/release-checklist.md
            CHANGELOG.md
            .github/scripts/verify-release-readiness.sh
          )
          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "Missing required hardening output: $path" >&2
              exit 1
            }
          done

          if grep -RInE 'org\.eclipse\.jgit|\bgit log\b|co[- ]?change|changeCouplingIncluded[^\n]*true' \
              core/src/main gradle-plugin/src/main maven/src/main; then
            echo "Git-history or commit-derived change coupling entered production scope" >&2
            exit 1
          fi

          chmod +x .github/scripts/verify-release-readiness.sh
          git diff --check

      - name: Verify the preparation tree
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-version-consistency.py
          gradle --no-daemon clean check publishToMavenLocal --warning-mode all
          bash .github/scripts/verify-consumer-fixtures.sh
          VERSION=$(sed -n 's/^projectVersion=//p' gradle.properties | head -n1 | tr -d '[:space:]')
          mvn -B -f site/pom.xml -Drevision="$VERSION" process-resources site
          bash .github/scripts/verify-release-readiness.sh --metadata-only

      - name: Commit verified preparation
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Harden 0.2.0 integration and provider contracts"
          git push origin HEAD:release/0.2.0-preparation-v2

      - name: Create or update pull request and squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head release/0.2.0-preparation-v2 \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')
          if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head release/0.2.0-preparation-v2 \
              --title "Harden 0.2.0 integration and provider contracts" \
              --body "Adds the shared source scan policy, Gradle/Maven configuration parity, provider SPI contract, schema-v2 contract, mixed Java/TypeScript tests, release documentation and publication checks. Git history and commit-derived change coupling remain explicitly excluded.")
            PR_NUMBER=${PR_URL##*/}
          else
            gh pr edit "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Harden 0.2.0 integration and provider contracts" \
              --body "Adds the shared source scan policy, Gradle/Maven configuration parity, provider SPI contract, schema-v2 contract, mixed Java/TypeScript tests, release documentation and publication checks. Git history and commit-derived change coupling remain explicitly excluded."
          fi

          HEAD_SHA=$(git rev-parse HEAD)
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$HEAD_SHA" \
            --subject "Harden 0.2.0 integration and provider contracts" \
            --body "Verified with the complete Gradle build, Maven-local publication, Gradle and Maven consumer fixtures, Maven site generation and release-contract checks."

      - name: Verify the exact merged main tree
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B verified-main origin/main
          test -f core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
          test ! -e .github/workflows/finalize-020-preparation-v2-v3.yml
          test ! -e .github/workflows/verify-020-hardening-main.yml
          test ! -e .release-transfer
          python3 .github/scripts/verify-version-consistency.py
          gradle --no-daemon clean check publishToMavenLocal --warning-mode all
          bash .github/scripts/verify-consumer-fixtures.sh
          VERSION=$(sed -n 's/^projectVersion=//p' gradle.properties | head -n1 | tr -d '[:space:]')
          mvn -B -f site/pom.xml -Drevision="$VERSION" process-resources site
          bash .github/scripts/verify-release-readiness.sh --metadata-only

      - name: Close obsolete duplicate feature pull request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view 104 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr close 104 \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Closed as obsolete: the JavaScript/TypeScript feature was already merged in #95, and the release-hardening changes have now been integrated separately."
          fi
