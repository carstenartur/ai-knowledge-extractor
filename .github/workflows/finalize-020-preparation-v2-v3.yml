name: Finalize 0.2.0 preparation

on:
  push:
    branches:
      - release/0.2.0-preparation-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-020-preparation-v2
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@v7
        with:
          ref: release/0.2.0-preparation-v2
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Merge the current main branch
        run: |
          set -euo pipefail
          git config user.name "ai-knowledge-extractor automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Materialize the complete product change
        run: |
          set -euo pipefail
          git fetch origin release/0.2.0-hardening:refs/remotes/origin/release/0.2.0-hardening
          git show origin/release/0.2.0-hardening:.github/scripts/apply-release-hardening.py \
            > /tmp/apply-release-hardening.py
          python3 .github/scripts/finalize-020-preparation.py

          rm -rf .release-transfer
          rm -f \
            .github/scripts/finalize-020-preparation.py \
            .github/scripts/materialize-020-hardening-base.py \
            .github/scripts/apply-release-hardening.py \
            .github/workflows/materialize-020-hardening-base.yml \
            .github/workflows/export-preparation-source.yml \
            .github/workflows/finalize-020-preparation-v2-v3.yml \
            .github/workflows/export-release-hardening-bootstrap.yml \
            .github/workflows/apply-release-hardening.yml \
            .github/workflows/finalize-release-hardening.yml \
            .github/workflows/override-finalize-release-hardening.yml \
            .github/workflows/verify-020-hardening-main.yml \
            .github/workflows/post-verify-020-cleanup.yml \
            .github/workflows/post-verify-020-final-cleanup.yml

          required=(
            core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
            docs/integrator-quickstart.md
            docs/provider-spi.md
            docs/schema-v2-contract.md
            docs/releases/0.2.0.md
            docs/release-checklist.md
            CHANGELOG.md
            .github/scripts/verify-release-readiness.sh
          )
          for path in "${required[@]}"; do
            test -s "$path" || {
              echo "Missing required hardening output: $path" >&2
              exit 1
            }
          done

          if grep -RInE 'org\.eclipse\.jgit|\bgit log\b|changeCouplingIncluded[^\n]*true' \
              core/src/main gradle-plugin/src/main maven/src/main; then
            echo "Git-history or commit-derived change coupling entered production scope" >&2
            exit 1
          fi

          chmod +x \
            .github/scripts/verify-release-readiness.sh \
            .github/scripts/verify-consumer-fixtures.sh
          git diff --check

      - name: Verify the preparation tree
        run: bash .github/scripts/verify-release-readiness.sh

      - name: Commit verified preparation
        run: |
          set -euo pipefail
          # The Actions token cannot write workflow files. Restore the workflow directory to the
          # checked-out state; temporary workflows are removed immediately afterwards through the
          # GitHub contents API, before a pull request is opened.
          git checkout HEAD -- .github/workflows
          git add -A
          git diff --cached --check
          git commit -m "Harden 0.2.0 integration and provider contracts [skip ci]"
          git push origin HEAD:release/0.2.0-preparation-v2
