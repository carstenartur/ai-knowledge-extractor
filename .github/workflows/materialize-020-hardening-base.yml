name: Materialize 0.2.0 hardening base

on:
  push:
    branches:
      - release/0.2.0-preparation-v2

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.2.0-preparation-v2
          fetch-depth: 0
      - name: Export the previously prepared hardening generator
        run: |
          set -euxo pipefail
          git fetch origin release/0.2.0-hardening:refs/remotes/origin/release/0.2.0-hardening
          git show origin/release/0.2.0-hardening:.github/scripts/apply-release-hardening.py > /tmp/apply-release-hardening.py
          python3 -m py_compile /tmp/apply-release-hardening.py
      - name: Package generator and tracked source
        run: |
          tar --exclude=.git --exclude=build --exclude='*/build' --exclude=target --exclude='*/target' -czf /tmp/source-before-hardening.tgz .
          cp /tmp/apply-release-hardening.py /tmp/exported-apply-release-hardening.py
      - uses: actions/upload-artifact@v7
        with:
          name: exported-020-hardening-generator
          path: |
            /tmp/exported-apply-release-hardening.py
            /tmp/source-before-hardening.tgz
          if-no-files-found: error
