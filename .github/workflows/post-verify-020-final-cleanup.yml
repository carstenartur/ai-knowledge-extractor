name: Final post-verify 0.2.0 cleanup

on:
  workflow_run:
    workflows:
      - Verify 0.2.0 hardening on main
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: post-verify-020-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate final repository state
        run: |
          test -e core/src/main/java/org/aiknowledge/core/sourcespi/SourceAnalysisConfiguration.java
          test -e docs/release-readiness-verified.md
          test ! -e .github/scripts/apply-release-hardening.py
          test ! -e .github/workflows/export-release-hardening-bootstrap.yml
          test ! -e .github/workflows/apply-release-hardening.yml
          grep -q 'versionControlHistoryUsed' docs/schema-v2-contract.md
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f) }'

      - name: Remove remaining one-shot verification workflows
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -f \
            .github/workflows/post-verify-020-cleanup.yml \
            .github/workflows/post-verify-020-final-cleanup.yml \
            .github/workflows/verify-020-hardening-main.yml
          git config user.name "ai-knowledge-extractor automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: remove one-shot 0.2.0 verification automation"
          git push origin HEAD:main
