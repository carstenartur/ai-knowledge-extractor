name: Prepare next development version

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice
        required: false
        type: string
        default: ''
      next_version_increment:
        description: Select the conventional next version when no exact version is supplied
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Validate and update locally, but do not push or create a PR
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-next:
    name: Prepare next development version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve versions from repository state
        id: versions
        env:
          EXACT_NEXT_VERSION: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(grep -E '^projectVersion=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]' || true)
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::gradle.properties must contain projectVersion=X.Y.Z-SNAPSHOT, found '$current'"
            exit 1
          fi

          released=${current%-SNAPSHOT}
          suggested=$(grep -E '^next\.release\.version=' release.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]' || true)
          if [[ -n "$suggested" && "$suggested" != "$released" ]]; then
            echo "::error::release.properties suggests $suggested, but main still represents release $released"
            exit 1
          fi

          exact=$(python3 - <<'PY'
          import os
          print(os.environ.get('EXACT_NEXT_VERSION', '').strip())
          PY
          )
          if [[ -n "$exact" ]]; then
            if ! [[ "$exact" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
              exit 1
            fi
            next="$exact"
          else
            IFS='.' read -r major minor patch <<< "$released"
            case "$NEXT_VERSION_INCREMENT" in
              patch) next="$major.$minor.$((patch + 1))-SNAPSHOT" ;;
              minor) next="$major.$((minor + 1)).0-SNAPSHOT" ;;
              major) next="$((major + 1)).0.0-SNAPSHOT" ;;
              *)
                echo "::error::Unsupported next_version_increment '$NEXT_VERSION_INCREMENT'"
                exit 1
                ;;
            esac
          fi

          RELEASED_VERSION="$released" NEXT_VERSION="$next" python3 - <<'PY'
          import os
          released = tuple(map(int, os.environ['RELEASED_VERSION'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_VERSION'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= released:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_VERSION']} "
                  f"must be newer than released version {os.environ['RELEASED_VERSION']}"
              )
          PY

          echo "released_version=$released" >> "$GITHUB_OUTPUT"
          echo "next_development_version=$next" >> "$GITHUB_OUTPUT"

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare next development version
        env:
          RELEASED_VERSION: ${{ steps.versions.outputs.released_version }}
          NEXT_DEVELOPMENT_VERSION: ${{ steps.versions.outputs.next_development_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/prepare-next.sh
