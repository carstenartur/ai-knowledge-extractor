name: Public distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable GitHub release, X.Y.Z, containing the public publishing tooling
        required: true
        type: string
      mode:
        description: Validate the tag, publish both channels or resume an individual channel
        type: choice
        default: validate
        options:
          - validate
          - publish-all
          - publish-central
          - publish-portal
          - verify-public

permissions:
  contents: read
  actions: read

concurrency:
  group: public-distribution-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Require the workflow from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify the immutable release with current support policy
        id: candidate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qualification
          set -o pipefail
          python3 .github/scripts/verify-public-release-candidate.py | tee qualification/candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: public-release-candidate
          path: qualification/candidate.json
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.7.1'
          cache-disabled: true
      - name: Build and validate signed publications without uploading
        if: inputs.mode != 'verify-public'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          gradle --no-daemon build
          bash .github/scripts/verify-consumer-fixtures.sh
          bash .github/scripts/verify-public-distribution.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-distribution-rehearsal
          path: |
            build/reports/public-distribution/**
            build/reports/public-consumers/**
          if-no-files-found: ignore

  publish:
    needs: qualify
    if: startsWith(inputs.mode, 'publish-')
    env:
      VERSION: ${{ inputs.version }}
    environment: public-distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.qualify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.7.1'
          cache-disabled: true
      - name: Check whether this version already exists on Central
        id: central
        run: |
          artifact=ai-knowledge-core
          url="https://repo.maven.apache.org/maven2/io/github/carstenartur/$artifact/$VERSION/$artifact-$VERSION.pom"
          status=$(curl --retry 3 --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
          case "$status" in
            200) echo 'available=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'available=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Central returned HTTP $status for $artifact"; exit 1 ;;
          esac
      - name: Publish the qualified tag to Maven Central
        if: inputs.mode != 'publish-portal' && steps.central.outputs.available == 'false'
        env:
          RELEASE_SHA: ${{ needs.qualify.outputs.sha }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME || secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD || secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY || secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          : "${ORG_GRADLE_PROJECT_mavenCentralUsername:?Set CENTRAL_USERNAME in public-distribution}"
          : "${ORG_GRADLE_PROJECT_mavenCentralPassword:?Set CENTRAL_PASSWORD in public-distribution}"
          : "${ORG_GRADLE_PROJECT_signingInMemoryKey:?Set MAVEN_GPG_KEY in public-distribution}"
          bash .github/scripts/perform-central-release.sh
      - name: Wait for Central repository propagation
        if: inputs.mode != 'publish-portal' && steps.central.outputs.available == 'false'
        run: |
          artifact=ai-knowledge-maven-plugin
          url="https://repo.maven.apache.org/maven2/io/github/carstenartur/$artifact/$VERSION/$artifact-$VERSION.pom"
          curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 30 --retry-all-errors --connect-timeout 10 --max-time 30 "$url"
      - name: Verify anonymous Central consumers before publishing to the Portal
        run: bash .github/scripts/verify-public-consumers.sh --central-only
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anonymous-central-consumers
          path: build/reports/central-consumers/**
          if-no-files-found: ignore
      - name: Check the exact version in the Plugin Portal catalog
        id: portal
        if: inputs.mode != 'publish-central'
        run: |
          listed=$(bash .github/scripts/verify-portal-listing.sh "$VERSION" --probe)
          echo "listed=$listed" >> "$GITHUB_OUTPUT"
      - name: Publish Gradle plugin to the Plugin Portal
        if: inputs.mode != 'publish-central' && steps.portal.outputs.listed == 'false'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_KEY || secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          : "${GRADLE_PUBLISH_KEY:?Set GRADLE_PUBLISH_KEY in public-distribution}"
          : "${GRADLE_PUBLISH_SECRET:?Set GRADLE_PUBLISH_SECRET in public-distribution}"
          gradle --no-daemon -PpublicDistribution=true :gradle-plugin:publishPlugins --validate-only
          gradle --no-daemon -PpublicDistribution=true :gradle-plugin:publishPlugins

  verify-public:
    needs: [qualify, publish]
    if: always() && needs.qualify.result == 'success' && (inputs.mode == 'verify-public' || (inputs.mode != 'publish-central' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.qualify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.7.1'
          cache-disabled: true
      - name: Verify anonymous consumers on both public channels
        env:
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/verify-public-consumers.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anonymous-public-consumers
          path: build/reports/public-consumers/**
      - name: Record public availability
        run: |
          cat build/reports/public-consumers/summary.json >> "$GITHUB_STEP_SUMMARY"
