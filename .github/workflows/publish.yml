name: Release

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice
        required: false
        type: string
        default: ''
      next_version_increment:
        description: Select the conventional next version when no exact version is supplied
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: Skip tests during release build
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate and build, but do not push refs, publish packages, create a release, or open a PR
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release plan from repository state
        id: versions
        env:
          EXACT_NEXT_VERSION: ${{ inputs.next_development_version }}
          NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(grep -E '^projectVersion=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]' || true)
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::gradle.properties must contain projectVersion=X.Y.Z-SNAPSHOT, found '$current'"
            exit 1
          fi

          release=${current%-SNAPSHOT}
          suggested=$(grep -E '^next\.release\.version=' release.properties | head -n 1 | cut -d'=' -f2 | tr -d '[:space:]' || true)
          if [[ -n "$suggested" && "$suggested" != "$release" ]]; then
            echo "::error::release.properties suggests $suggested, but the current project version requires release $release"
            exit 1
          fi

          exact=$(python3 - <<'PY'
          import os
          print(os.environ.get('EXACT_NEXT_VERSION', '').strip())
          PY
          )
          if [[ -n "$exact" ]]; then
            if ! [[ "$exact" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use X.Y.Z-SNAPSHOT"
              exit 1
            fi
            next="$exact"
            source=exact
          else
            IFS='.' read -r major minor patch <<< "$release"
            case "$NEXT_VERSION_INCREMENT" in
              patch) next="$major.$minor.$((patch + 1))-SNAPSHOT" ;;
              minor) next="$major.$((minor + 1)).0-SNAPSHOT" ;;
              major) next="$((major + 1)).0.0-SNAPSHOT" ;;
              *)
                echo "::error::Unsupported next_version_increment '$NEXT_VERSION_INCREMENT'"
                exit 1
                ;;
            esac
            source="$NEXT_VERSION_INCREMENT"
          fi

          RELEASE_VERSION="$release" NEXT_VERSION="$next" python3 - <<'PY'
          import os
          release = tuple(map(int, os.environ['RELEASE_VERSION'].split('.')))
          next_version = tuple(
              map(int, os.environ['NEXT_VERSION'].removesuffix('-SNAPSHOT').split('.'))
          )
          if next_version <= release:
              raise SystemExit(
                  f"::error::Next development version {os.environ['NEXT_VERSION']} "
                  f"must be newer than release {os.environ['RELEASE_VERSION']}"
              )
          PY

          echo "release_version=$release" >> "$GITHUB_OUTPUT"
          echo "next_development_version=$next" >> "$GITHUB_OUTPUT"
          {
            echo '## Release version plan'
            echo
            echo "- Current repository version: \`$current\`"
            echo "- Release version: \`$release\`"
            echo "- Next development version: \`$next\`"
            echo "- Next-version source: \`$source\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run release workflow
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.versions.outputs.next_development_version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_BRANCH: main
          METADATA_HELPER: .github/scripts/update-release-metadata.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
