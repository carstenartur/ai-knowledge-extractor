name: Release

on:
  push:
    branches: [ 'maintenance/0.1.x' ]
    paths:
      - '.github/release-requests/0.1.x.json'
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to publish, without leading v, e.g. 0.1.9
        required: true
        type: string
        default: 0.1.9
      next_development_version:
        description: Optional next development version, e.g. 0.1.10-SNAPSHOT
        required: false
        type: string
      skip_tests:
        description: Skip tests during release build
        required: false
        type: boolean
        default: false
      dry_run:
        description: Validate and build, but do not push refs, publish packages, create a release, or open a PR
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve and validate release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_VERSION: ${{ inputs.release_version }}
          DISPATCH_NEXT_VERSION: ${{ inputs.next_development_version }}
          DISPATCH_SKIP_TESTS: ${{ inputs.skip_tests }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            request_output=$(mktemp)
            python3 .github/scripts/resolve-maintenance-release-request.py \
              --request .github/release-requests/0.1.x.json \
              --output "$request_output"
            cat "$request_output" >> "$GITHUB_OUTPUT"
            # Values are safe to source only after strict parser validation.
            source "$request_output"

            git cat-file -e "${qualified_commit}^{commit}"
            if ! git merge-base --is-ancestor \
                "$qualified_commit" "$GITHUB_SHA"; then
              echo "::error::qualifiedCommit is not an ancestor of the request commit" >&2
              exit 1
            fi
            mapfile -t changed_paths < <(
              git diff --name-only "$qualified_commit" "$GITHUB_SHA"
            )
            if [[ ${#changed_paths[@]} -ne 1 \
                || "${changed_paths[0]}" \
                  != ".github/release-requests/0.1.x.json" ]]; then
              echo "::error::Only the maintenance release request may differ from qualifiedCommit" >&2
              printf 'changed path: %s\n' "${changed_paths[@]}" >&2
              exit 1
            fi
          else
            if ! [[ "$DISPATCH_RELEASE_VERSION" =~ ^0\.1\.[0-9]+$ ]]; then
              echo "::error::release_version must use 0.1.X" >&2
              exit 1
            fi
            if [[ -n "$DISPATCH_NEXT_VERSION" \
                && ! "$DISPATCH_NEXT_VERSION" =~ ^0\.1\.[0-9]+-SNAPSHOT$ ]]; then
              echo "::error::next_development_version must use 0.1.X-SNAPSHOT" >&2
              exit 1
            fi
            if [[ "$DISPATCH_SKIP_TESTS" != "true" \
                && "$DISPATCH_SKIP_TESTS" != "false" ]]; then
              echo "::error::skip_tests must be boolean" >&2
              exit 1
            fi
            if [[ "$DISPATCH_DRY_RUN" != "true" \
                && "$DISPATCH_DRY_RUN" != "false" ]]; then
              echo "::error::dry_run must be boolean" >&2
              exit 1
            fi
            {
              printf 'release_version=%s\n' "$DISPATCH_RELEASE_VERSION"
              printf 'next_version=%s\n' "$DISPATCH_NEXT_VERSION"
              printf 'skip_tests=%s\n' "$DISPATCH_SKIP_TESTS"
              printf 'dry_run=%s\n' "$DISPATCH_DRY_RUN"
              printf 'request_id=workflow-dispatch-%s\n' "$GITHUB_RUN_ID"
              printf 'qualified_commit=%s\n' "$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          gradle-version: '9.5.1'

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Run release workflow
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.request.outputs.next_version }}
          SKIP_TESTS: ${{ steps.request.outputs.skip_tests }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          METADATA_HELPER: .github/scripts/update-release-metadata.py
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
