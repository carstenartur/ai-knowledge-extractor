name: Verify published release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to resolve from GitHub Packages (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify published ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released verification scripts
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '9.5.1'

      - name: Verify GitHub Release and clean remote consumers
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-published-release.sh

      - name: Upload published-release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-release-${{ inputs.version }}-evidence
          path: build/reports/published-release-smoke
          if-no-files-found: warn
          retention-days: 90
