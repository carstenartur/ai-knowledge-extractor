pluginManagement {
    def publishedPlugin =
        providers.gradleProperty('publishedPlugin').orNull == 'true'

    if (publishedPlugin) {
        def aiKnowledgeVersion = providers
            .gradleProperty('aiKnowledgeVersion')
            .getOrElse('')
        if (aiKnowledgeVersion.isBlank()) {
            throw new GradleException(
                'Published plugin mode requires -PaiKnowledgeVersion=<version>.')
        }
        plugins {
            id 'io.github.carstenartur.ai-knowledge-extractor' version aiKnowledgeVersion
        }
    } else {
        includeBuild('../../..')
    }

    repositories {
        if (publishedPlugin) {
            mavenLocal {
                content {
                    includeGroup('io.github.carstenartur')
                    includeGroup('io.github.carstenartur.ai-knowledge-extractor')
                }
            }
            mavenCentral {
                content {
                    excludeGroup('io.github.carstenartur')
                    excludeGroup('io.github.carstenartur.ai-knowledge-extractor')
                }
            }
        } else {
            gradlePluginPortal()
            mavenCentral()
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal {
            content { includeGroup('example.aiknowledge') }
        }
        mavenCentral()
    }
}

rootProject.name = 'ai-knowledge-gradle-consumer-fixture'
